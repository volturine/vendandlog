version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      monthly-batch:
        patterns:
          - "*"

  - package-ecosystem: "bun"
    directory: "/packages/frontend"
    schedule:
      interval: "monthly"
    groups:
      monthly-batch:
        patterns:
          - "*"
    # svelte-check and @sveltejs/kit still require the JS compiler (TypeScript 6).
    # TypeScript 7 is the native Go port without a stable programmatic API.
    ignore:
      - dependency-name: "typescript"
        versions: [">=7"]

  - package-ecosystem: "pip"
    directory: "/packages/backend"
    schedule:
      interval: "monthly"
    groups:
      monthly-batch:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "monthly"
    groups:
      monthly-batch:
        patterns:
          - "*"
