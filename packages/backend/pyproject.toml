[project]
    name            = "vendandlog-backend"
    version         = "0.1.0"
    description     = "Vendandlog FastAPI application package"
    requires-python = ">=3.12"
    dependencies = [
        "alembic>=1.14",
        "fastapi>=0.115.0",
        "psycopg[binary]>=3.2",
        "pydantic>=2.9",
        "pydantic-settings>=2.6",
        "sqlmodel>=0.0.24",
        "uvicorn>=0.32.0",
    ]

[build-system]
    requires      = ["hatchling"]
    build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
    packages = ["app"]

[tool.ruff]
    target-version = "py312"
    line-length    = 160
    indent-width   = 4

    [tool.ruff.lint]
        select = ["I", "E", "F", "UP", "B", "SIM"]
        ignore = ["B008", "E501"]

        [tool.ruff.lint.isort]
            known-first-party = ["app"]

    [tool.ruff.format]
        quote-style = "single"
        line-ending = "auto"

[tool.pytest.ini_options]
    testpaths      = ["tests"]
    pythonpath     = ["."]
    python_files   = ["test_*.py"]
    addopts        = ["-q", "--tb=short"]

[dependency-groups]
    dev = [
        "httpx2>=2.12.0",
        "pytest>=8.3",
        "ruff>=0.8",
    ]
